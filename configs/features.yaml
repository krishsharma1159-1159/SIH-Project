# MEGHNETRA Feature Registry & Engineering Rules
# All features must map to genuine meteorological and geophysical measurements

feature_groups:
  satellite:
    - name: "tir1_bt"
      description: "Thermal Infrared 1 Brightness Temperature"
      canonical_units: "K"
      qc_range: [160.0, 340.0]
    - name: "tir2_bt"
      description: "Thermal Infrared 2 Brightness Temperature"
      canonical_units: "K"
      qc_range: [160.0, 340.0]
    - name: "wv_bt"
      description: "Water Vapour Channel Brightness Temperature"
      canonical_units: "K"
      qc_range: [180.0, 280.0]
    - name: "split_window_diff"
      description: "TIR1 - TIR2 difference (low-level moisture proxy)"
      canonical_units: "K"
      derived_from: ["tir1_bt", "tir2_bt"]
      formula: "tir1_bt - tir2_bt"

  atmospheric:
    - name: "temperature_2m"
      canonical_units: "K"
      qc_range: [240.0, 330.0]
    - name: "relative_humidity_2m"
      canonical_units: "%"
      qc_range: [0.0, 100.0]
    - name: "specific_humidity_2m"
      canonical_units: "kg/kg"
      qc_range: [0.0, 0.05]
    - name: "u_wind_10m"
      canonical_units: "m/s"
      qc_range: [-60.0, 60.0]
    - name: "v_wind_10m"
      canonical_units: "m/s"
      qc_range: [-60.0, 60.0]
    - name: "wind_speed_10m"
      canonical_units: "m/s"
      derived_from: ["u_wind_10m", "v_wind_10m"]
      formula: "sqrt(u^2 + v^2)"
    - name: "surface_pressure"
      canonical_units: "Pa"
      qc_range: [50000.0, 105000.0]
    - name: "cape"
      canonical_units: "J/kg"
      qc_range: [0.0, 6000.0]
    - name: "cin"
      canonical_units: "J/kg"
      qc_range: [-1000.0, 0.0]

  terrain_static:
    - name: "elevation"
      canonical_units: "m"
      qc_range: [100.0, 8000.0]
    - name: "slope_degrees"
      canonical_units: "degrees"
      qc_range: [0.0, 90.0]
    - name: "flow_accumulation"
      canonical_units: "log10(cells)"
      qc_range: [0.0, 10.0]

  temporal_tendencies:
    - name: "temp_tendency_1h"
      derived_from: "temperature_2m"
      formula: "T(t) - T(t-1)"
    - name: "moisture_tendency_1h"
      derived_from: "specific_humidity_2m"
      formula: "q(t) - q(t-1)"
    - name: "tir_cooling_rate_1h"
      derived_from: "tir1_bt"
      formula: "TIR1(t) - TIR1(t-1)"

scaling:
  scaler_type: "standard" # standard (z-score) or robust
  statistics_file: "artifacts/scalers/training_scaler.json"
  learned_from: "train_split_only"
