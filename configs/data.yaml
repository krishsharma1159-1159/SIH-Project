# MEGHNETRA Data Configuration
# Defines real dataset ingestion paths, data providers, and variable mappings.
# Scientific integrity rule: Never use fake replacement data.

data_root: "data"

datasets:
  insat3dr:
    name: "INSAT-3DR MOSDAC"
    enabled: true
    source_type: "satellite"
    directory: "data/insat3dr"
    file_patterns: ["*.nc", "*.h5", "*.hdf"]
    temporal_cadence_minutes: 30
    spatial_projection: "geostationary / geographic"
    channels:
      required: ["TIR1", "TIR2", "WV"]
      optional: ["VIS", "SWIR", "MIR", "QPE", "HEM", "IMG_TIR1", "IMG_TIR2", "IMG_WV"]
    variable_mapping:
      tir1: ["TIR1", "IMG_TIR1", "temp_tir1", "bt_tir1"]
      tir2: ["TIR2", "IMG_TIR2", "temp_tir2", "bt_tir2"]
      wv: ["WV", "IMG_WV", "water_vapour", "bt_wv"]
      qpe: ["QPE", "HEM", "rainfall_rate", "satellite_qpe"]
      ctt: ["CTT", "cloud_top_temperature", "cloud_top_temp"]

  imdaa:
    name: "IMDAA High-Resolution Reanalysis"
    enabled: true
    source_type: "reanalysis"
    directory: "data/imdaa"
    file_patterns: ["*.nc", "*.nc4"]
    temporal_cadence_hours: 1
    spatial_resolution_km: 12.0
    variable_mapping:
      temperature_2m: ["t2m", "T2M", "temperature", "temp_2m", "TMP_2maboveground"]
      relative_humidity: ["r2", "RH2M", "relative_humidity", "rh_2m", "RH_2maboveground"]
      specific_humidity: ["q2", "SPFH_2maboveground", "specific_humidity", "q_2m"]
      u_wind_10m: ["u10", "U10M", "u_wind", "UGRD_10maboveground"]
      v_wind_10m: ["v10", "V10M", "v_wind", "VGRD_10maboveground"]
      surface_pressure: ["sp", "PRES_surface", "surface_pressure", "ps"]
      precipitation: ["tp", "APCP_surface", "total_precipitation", "rain", "prcp"]
      cape: ["cape", "CAPE_surface", "convective_available_potential_energy"]
      cin: ["cin", "CIN_surface", "convective_inhibition"]
      geopotential_500: ["z500", "HGT_500mb", "geopotential_height_500"]

  radar:
    name: "IMD Doppler Weather Radar (DWR)"
    enabled: false # Switched to true when actual radar data is connected
    source_type: "radar"
    directory: "data/radar"
    file_patterns: ["*.nc", "*.h5", "*.vol"]
    temporal_cadence_minutes: 10
    variable_mapping:
      reflectivity: ["dBZ", "ref", "reflectivity", "max_reflectivity"]
      velocity: ["V", "radial_velocity", "vel"]
      qpe: ["radar_qpe", "accumulated_precip", "rain_rate"]

  dem:
    name: "High-Resolution DEM (CartoDEM / SRTM)"
    enabled: true
    source_type: "terrain"
    directory: "data/dem"
    file_patterns: ["*.tif", "*.tiff", "*.nc"]
    static: true
    derived_features: ["slope", "aspect", "flow_accumulation", "topographic_wetness_index"]

  hydrology:
    name: "CWC / State Hydrological Gauges"
    enabled: false # Meteorological proxy used until genuine hydrological streamflow is supplied
    source_type: "hydrology"
    directory: "data/hydrology"
    file_patterns: ["*.csv", "*.nc"]
    variable_mapping:
      discharge: ["discharge_m3s", "flow_rate", "cfs"]
      river_water_level: ["water_level_m", "gauge_height_m"]

cache:
  regridded_dir: "data/cache/regridded"
  cubes_dir: "data/cache/cubes"
  static_terrain_file: "data/cache/terrain_features.nc"
