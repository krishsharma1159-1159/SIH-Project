# MEGHNETRA Model Architecture Configuration
# Model 1 Baseline: MEGHNETRA-ConvLSTM-v1

model:
  name: "MEGHNETRA-ConvLSTM-v1"
  architecture: "Spatiotemporal ConvLSTM with Multi-Task Output Heads"
  version: "1.0.0"

input:
  lookback_steps: 6 # 6 hours of historical inputs at 1h resolution
  channels_count: 12
  height: 64
  width: 64

encoder:
  conv_channels: [32, 64, 128]
  kernel_size: 3
  padding: 1
  convlstm_hidden_dim: 128
  convlstm_layers: 2

heads:
  forecast_horizons: [2, 3, 4, 5, 6] # 5 horizons
  tasks:
    storm:
      type: "classification"
      activation: "sigmoid"
      output_channels: 5 # [B, 5, H, W]
    cloudburst:
      type: "classification"
      activation: "sigmoid"
      output_channels: 5
    flash_flood:
      type: "classification"
      activation: "sigmoid"
      output_channels: 5
    rainfall_rate:
      type: "regression"
      activation: "relu"
      output_channels: 5
