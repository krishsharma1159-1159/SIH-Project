# MEGHNETRA Hazard Label Formulations & Decision Grounding
# Follows strict meteorological and hydrological definitions

hazards:
  cloudburst:
    scientific_basis: "IMD (India Meteorological Department) Definition"
    definition: "Precipitation exceeding 100 mm/hour over a localized footprint"
    target_type: "binary_classification"
    threshold_mm_per_hour: 100.0
    spatial_footprint_km: 10.0 # spatial neighborhood constraint
    missing_data_treatment: "exclude_timestep"

  storm:
    scientific_basis: "Convective Storm State & Radar/Satellite Corroboration"
    definition: "Severe convective precipitation rate (>30 mm/hr) or radar reflectivity > 45 dBZ"
    target_type: "binary_classification"
    min_event_duration_hours: 1

  flash_flood:
    scientific_basis: "Hydrometeorological Rapid Runoff Risk Proxy"
    target_type: "binary_classification"
    proxy_name: "rapid_runoff_risk"
    note: "Labeled as 'rapid_runoff_risk' proxy until genuine CWC streamflow/gauge records are supplied"
    antecedent_precipitation_window_hours: 24
    soil_saturation_proxy_threshold: 0.85

horizons:
  forecast_lead_times_hours: [2, 3, 4, 5, 6]
  target_format: "multi_horizon_direct" # direct multi-step output [B, 5, H, W]
