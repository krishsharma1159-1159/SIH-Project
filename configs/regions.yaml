# MEGHNETRA Spatial Domain & Regional Configuration
# Target region: Uttarakhand and Himalayan Foothills

domain:
  name: "Uttarakhand_Himalayan_Foothills"
  description: "Complex orographic Himalayan terrain and foothill drainage basins"
  bounds:
    lat_min: 28.5
    lat_max: 31.5
    lon_min: 77.5
    lon_max: 81.2

# Common spatial grid configuration
# The actual grid resolution is dynamically calculated during resampling
grid:
  target_resolution_degrees: 0.02 # Approximately ~2.1 km at 30°N
  coordinate_system: "EPSG:4326"
  resampling_method:
    continuous: "bilinear"
    categorical: "nearest"
    accumulation: "conservative"

# Key operational basins & monitoring sub-regions
operational_stations:
  dehradun:
    name: "Dehradun & Song Catchment"
    lat: 30.3165
    lon: 78.0322
    elevation_m: 648
    catchment: "Song & Bindal River"
  mussoorie:
    name: "Mussoorie Ridge & Escarpment"
    lat: 30.4598
    lon: 78.0644
    elevation_m: 2005
    catchment: "Aglar & Rispana Headwaters"
  haridwar:
    name: "Haridwar Barrage & Floodplain"
    lat: 29.9457
    lon: 78.1642
    elevation_m: 294
    catchment: "Upper Ganga Outflow"
  rishikesh:
    name: "Rishikesh Gorge & Confluence"
    lat: 30.0869
    lon: 78.2676
    elevation_m: 372
    catchment: "Ganga Gorge Entrance"
  tehri:
    name: "Tehri Catchment & Bhagirathi Valley"
    lat: 30.3804
    lon: 78.4803
    elevation_m: 1750
    catchment: "Bhagirathi River Basin"
  rudraprayag:
    name: "Rudraprayag Alaknanda-Mandakini Confluence"
    lat: 30.2844
    lon: 78.9811
    elevation_m: 895
    catchment: "Mandakini-Alaknanda Basin"
