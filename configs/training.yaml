# MEGHNETRA Training Pipeline Configuration
# Enforces chronological temporal splitting to prevent spatiotemporal data leakage

experiment:
  name: "convlstm_baseline_run"
  seed: 42
  deterministic: true

splitting:
  strategy: "chronological"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  leakage_check: true # Validates train_max_time < val_min_time < test_min_time

training:
  batch_size: 8
  max_epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001
  mixed_precision: false # Safe for CPU container
  early_stopping:
    patience: 7
    monitor: "val_total_loss"
    mode: "min"

loss:
  type: "multi_task_focal_and_mae"
  focal_gamma: 2.0
  focal_alpha: 0.75
  task_weights:
    lambda_storm: 1.0
    lambda_cloudburst: 2.0 # Higher weight due to extreme event rarity
    lambda_flood: 1.5
    lambda_rainfall: 0.5
